apiVersion: v1
kind: Namespace
metadata:
  name: observability
  labels:
    app.kubernetes.io/part-of: ottawa-fleet
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: telemetry-budget
spec:
  hard:
    requests.cpu: "400m"
    requests.memory: 1280Mi
    limits.cpu: "2"
    limits.memory: 1792Mi
    pods: "6"
    services: "5"
    persistentvolumeclaims: "0"
