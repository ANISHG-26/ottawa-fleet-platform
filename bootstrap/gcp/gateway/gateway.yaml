apiVersion: apps/v1
kind: Deployment
metadata:
  name: fleet-gateway
  namespace: fleet-gateway
  labels:
    app.kubernetes.io/name: fleet-gateway
    app.kubernetes.io/part-of: ottawa-fleet
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: fleet-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fleet-gateway
        app.kubernetes.io/part-of: ottawa-fleet
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 10
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: nginx
          image: nginxinc/nginx-unprivileged:1.30-alpine@sha256:ed04ec1ff34502c339ee5c3ae3f855442398edc1d05591e2b98981dcbbd20b1e
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: https
              containerPort: 8443
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          readinessProbe:
            tcpSocket: {port: https}
            periodSeconds: 5
            timeoutSeconds: 2
          livenessProbe:
            tcpSocket: {port: https}
            periodSeconds: 15
            timeoutSeconds: 2
          volumeMounts:
            - name: config
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
              readOnly: true
            - name: tls
              mountPath: /var/run/gateway-tls
              readOnly: true
            - name: argocd-ca
              mountPath: /var/run/argocd-ca
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: fleet-gateway-nginx
        - name: tls
          secret:
            secretName: fleet-gateway-tls
            defaultMode: 0440
        - name: argocd-ca
          configMap:
            name: argocd-server-ca
            items:
              - key: ca.crt
                path: ca.crt
        - name: tmp
          emptyDir:
            sizeLimit: 16Mi
---
