name: Bounded GCP lab

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bounded-gcp-lab
  cancel-in-progress: false

jobs:
  provision:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: gcp-lab
    timeout-minutes: 90
    permissions:
      contents: read
      id-token: write
    env:
      CLOUDSDK_CORE_DISABLE_PROMPTS: "1"
    steps:
      - name: Check out the exact dispatched revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Mask private input fields before cloud authentication
        run: python3 -m scripts.ci_log_masks
        env:
          LAB_TFVARS_JSON: ${{ secrets.LAB_TFVARS_JSON }}
          GCP_WIF_PROVIDER: ${{ secrets.GCP_WIF_PROVIDER }}

      - name: Authenticate with short-lived workload identity
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}
          create_credentials_file: true
          export_environment_variables: true

      - name: Install pinned Google Cloud CLI
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          version: '587.0.0'
          install_components: 'gke-gcloud-auth-plugin,kubectl'

      - name: Install pinned Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: 1.8.4
          terraform_wrapper: false

      - name: Verify required cloud tools
        run: |
          command -v gcloud
          command -v gke-gcloud-auth-plugin
          kubectl version --client
          terraform version

      - name: Upload private run inputs, register expiry, then provision
        run: python3 -m scripts.ci_lab
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          LAB_STATE_BUCKET: ${{ secrets.LAB_STATE_BUCKET }}
          LAB_TFVARS_JSON: ${{ secrets.LAB_TFVARS_JSON }}
          LAB_SHUTDOWN_URL: ${{ secrets.LAB_SHUTDOWN_URL }}
          LAB_TASK_QUEUE: ${{ secrets.LAB_TASK_QUEUE }}
          LAB_TASK_LOCATION: ${{ secrets.LAB_TASK_LOCATION }}
          LAB_TASK_INVOKER_SERVICE_ACCOUNT: ${{ secrets.LAB_TASK_INVOKER_SERVICE_ACCOUNT }}
