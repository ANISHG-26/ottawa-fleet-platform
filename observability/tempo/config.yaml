server:
  http_listen_port: 3200
  log_level: warn
distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318
storage:
  trace:
    backend: local
    wal:
      path: /data/wal
    local:
      path: /data/blocks
    pool:
      max_workers: 20
      queue_depth: 100
backend_scheduler:
  provider:
    compaction:
      compaction:
        block_retention: 24h
usage_report:
  reporting_enabled: false
