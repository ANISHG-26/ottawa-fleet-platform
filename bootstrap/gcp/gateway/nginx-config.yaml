apiVersion: v1
kind: ConfigMap
metadata:
  name: fleet-gateway-nginx
  namespace: fleet-gateway
data:
  nginx.conf: |
    worker_processes auto;
    pid /tmp/nginx.pid;
    error_log /dev/stderr warn;

    events { worker_connections 512; }

    http {
      log_format gateway '$remote_addr [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent';
      access_log /dev/stdout gateway;
      client_body_temp_path /tmp/client_temp;
      proxy_temp_path /tmp/proxy_temp;
      fastcgi_temp_path /tmp/fastcgi_temp;
      uwsgi_temp_path /tmp/uwsgi_temp;
      scgi_temp_path /tmp/scgi_temp;
      server_tokens off;

      map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
      }

      server {
        listen 8080 default_server;
        server_name _;
        return 308 https://$host$request_uri;
      }

      server {
        listen 8443 ssl default_server;
        absolute_redirect off;
        server_name _;
        ssl_certificate /var/run/gateway-tls/tls.crt;
        ssl_certificate_key /var/run/gateway-tls/tls.key;
        ssl_protocols TLSv1.2 TLSv1.3;

        # The app's public web service is the only root route.
        location / {
          proxy_pass http://web.fleet-app.svc.cluster.local:8080;
          proxy_http_version 1.1;
          proxy_set_header Host $host;
          proxy_set_header X-Forwarded-Proto https;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location = /grafana { return 308 /grafana/; }
        location /grafana/ {
          # Grafana serves from its configured /grafana/ subpath, so preserve the URI.
          proxy_pass http://grafana.observability.svc.cluster.local:3000;
          proxy_http_version 1.1;
          proxy_set_header Host $host;
          proxy_set_header X-Forwarded-Proto https;
          proxy_set_header X-Forwarded-Prefix /grafana;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header Upgrade $http_upgrade;
          proxy_set_header Connection $connection_upgrade;
        }

        location = /argo { return 308 /argo/; }
        location /argo/ {
          # Argo uses its native HTTPS endpoint; the root path is kept intact.
          proxy_pass https://argocd-server.argocd.svc.cluster.local:443;
          proxy_ssl_server_name on;
          proxy_ssl_name argocd-server;
          proxy_ssl_trusted_certificate /var/run/argocd-ca/ca.crt;
          proxy_ssl_verify on;
          proxy_ssl_verify_depth 2;
          proxy_http_version 1.1;
          proxy_set_header Host $host;
          proxy_set_header X-Forwarded-Proto https;
          proxy_set_header X-Forwarded-Prefix /argo;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header Upgrade $http_upgrade;
          proxy_set_header Connection $connection_upgrade;
          proxy_buffering off;
        }
      }
    }
