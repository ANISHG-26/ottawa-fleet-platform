name: Repository checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repository-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  documentation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check documentation and configuration
        run: python3 scripts/check_repository.py
      - name: Run bounded offline platform checks
        run: python3 -m unittest discover -s tests -v

  terraform-static:
    strategy:
      matrix:
        root: [lab, foundation, automation]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@v4.0.1
        with:
          terraform_version: 1.8.4
          terraform_wrapper: false
      - name: Initialize the pinned provider without backend access
        run: terraform init -backend=false -input=false
        working-directory: terraform/${{ matrix.root }}
      - name: Lock the supported provider platforms
        run: terraform providers lock -platform=linux_amd64 -platform=windows_amd64
        working-directory: terraform/${{ matrix.root }}
      - uses: actions/upload-artifact@v4
        with:
          name: terraform-provider-lock-${{ matrix.root }}
          path: terraform/${{ matrix.root }}/.terraform.lock.hcl
          include-hidden-files: true
          if-no-files-found: error
      - name: Check Terraform formatting
        run: terraform fmt -check -recursive
        working-directory: terraform/${{ matrix.root }}
      - name: Validate Terraform configuration
        run: terraform validate
        working-directory: terraform/${{ matrix.root }}
      - name: Run provider-mocked bounds checks
        run: terraform test -no-color
        working-directory: terraform/${{ matrix.root }}

  shutdown-runtime-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install the pinned function dependencies
        run: python -m pip install -r functions/lab_shutdown/requirements.txt
      - name: Start the HTTP function without cloud credentials
        run: python -m scripts.smoke_shutdown_runtime

  cleanup-worker-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Verify the immutable cleanup image and Terraform archive
        run: |
          docker run --rm --read-only --tmpfs /tmp:size=384m \
            -v "$GITHUB_WORKSPACE:/workspace:ro" -w /workspace \
            --entrypoint python3 \
            gcr.io/google.com/cloudsdktool/google-cloud-cli:stable@sha256:73a97b855d386c74bee3facd59ccc261006c55a9812b7913fa6b93816010a1bc \
            -c 'import subprocess,tempfile; from pathlib import Path; from scripts.cleanup_execute import install_terraform; subprocess.run(["gcloud","version"],check=True); temporary=tempfile.TemporaryDirectory(); binary=install_terraform(Path(temporary.name)); subprocess.run([str(binary),"version"],check=True); subprocess.run(["python3","-m","scripts.cleanup_execute","--help"],check=True)'
