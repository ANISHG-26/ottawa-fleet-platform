apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/part-of: ottawa-fleet
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: grafana
  template:
    metadata:
      labels:
        app.kubernetes.io/name: grafana
        app.kubernetes.io/part-of: ottawa-fleet
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 472
        runAsGroup: 472
        fsGroup: 472
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: grafana
          image: grafana/grafana:13.2.2
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          env:
            - {name: GF_SECURITY_ADMIN_USER, value: admin}
            - {name: GF_SECURITY_COOKIE_SECURE, value: "true"}
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef: {name: grafana-admin, key: password}
            - {name: GF_AUTH_ANONYMOUS_ENABLED, value: "false"}
            - {name: GF_USERS_ALLOW_SIGN_UP, value: "false"}
            - {name: GF_ANALYTICS_REPORTING_ENABLED, value: "false"}
            - {name: GF_PLUGINS_PREINSTALL_AUTO_UPDATE, value: "false"}
            - {name: GF_LOG_MODE, value: console}
            - {name: GF_SERVER_ROOT_URL, value: "https://GATEWAY_IP_PLACEHOLDER/grafana/"}
            - {name: GF_SERVER_SERVE_FROM_SUB_PATH, value: "true"}
          ports:
            - {name: http, containerPort: 3000}
          resources:
            requests: {cpu: 50m, memory: 192Mi}
            limits: {cpu: 200m, memory: 256Mi}
          readinessProbe:
            httpGet: {path: /grafana/api/health, port: http}
            initialDelaySeconds: 10
            periodSeconds: 10
          volumeMounts:
            - {name: data, mountPath: /var/lib/grafana}
            - {name: provisioning, mountPath: /etc/grafana/provisioning, readOnly: true}
            - {name: dashboard, mountPath: /var/lib/grafana/dashboards, readOnly: true}
            - {name: tmp, mountPath: /tmp}
            - {name: logs, mountPath: /var/log/grafana}
      volumes:
        - name: data
          emptyDir: {sizeLimit: 128Mi}
        - name: provisioning
          configMap:
            name: grafana-provisioning
            items:
              - {key: datasources.yaml, path: datasources/datasources.yaml}
              - {key: dashboards.yaml, path: dashboards/dashboards.yaml}
        - name: dashboard
          configMap: {name: grafana-dashboard}
        - name: tmp
          emptyDir: {sizeLimit: 64Mi}
        - name: logs
          emptyDir: {sizeLimit: 64Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  labels:
    app.kubernetes.io/name: grafana
spec:
  selector: {app.kubernetes.io/name: grafana}
  ports:
    - {name: http, port: 3000, targetPort: http}
