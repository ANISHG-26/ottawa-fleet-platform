name: Repository checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repository-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  documentation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check documentation and configuration
        run: python3 scripts/check_repository.py
      - name: Run bounded offline platform checks
        run: python3 -m unittest discover -s tests -v

  terraform-static:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@v4.0.1
        with:
          terraform_version: 1.8.4
          terraform_wrapper: false
      - name: Initialize the pinned provider without backend access
        run: terraform init -backend=false -input=false
        working-directory: terraform/lab
      - name: Check Terraform formatting
        run: terraform fmt -check -recursive
        working-directory: terraform/lab
      - name: Validate Terraform configuration
        run: terraform validate
        working-directory: terraform/lab
      - name: Run provider-mocked bounds checks
        run: terraform test -no-color
        working-directory: terraform/lab
